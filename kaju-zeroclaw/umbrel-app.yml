gallery: []
releaseNotes: >-
  Update to ZeroClaw v0.7.5. Adds in-browser onboarding via a new
  /onboard flow, schema-driven per-property config CRUD with an
  OpenAPI 3.1 spec, live drift detection for hand-edited config.toml,
  and a three-surface personality editor (CLI / TUI / web) for the
  seven runtime markdown files. ACP gains session cancellation and a
  tool-approval back-channel, per-provider pricing makes cost tracking
  accurate, and the web dashboard learns hot model switching and a
  real stop button. Installer overhaul with presets and a TTY feature
  picker; MUSL Linux static binaries are back.
